[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-circus"
version = "0.1.0"
description = "AI Agent Circus Setup"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "docker>=7.0.0",
    "pygithub>=2.9.1",
    "tomli-w>=1.2.0",
    "typer>=0.21.1",
]

[project.scripts]
agent-circus = "agent_circus.cli:run_cli"
agent-circus-update-templates = "agent_circus.update_versions:run"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_circus"]

[tool.uv]
preview-features = ["audit-command"]

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0",
    "ruff>=0.14.14",
    "ty>=0.0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff.lint]
extend-select = ["I"]
extend-safe-fixes = ["I"]
preview = true
