<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>msb-circus dashboard</title>
    <link rel="stylesheet" href="dashboard.css" />
    <script src="dashboard.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">msb-circus <span class="brand-sub">dashboard</span></h1>
      <span id="proxy-label" class="proxy-label mono"></span>
      <span class="spacer"></span>
      <span id="live-status" class="live" aria-live="polite"></span>
      <span id="updated-at" class="updated"></span>
      <button id="theme-toggle" class="icon-btn" type="button" title="Theme">◐</button>
      <button id="pause-toggle" class="icon-btn" type="button" title="Pause polling">⏸</button>
    </header>

    <div id="banner" class="banner" hidden></div>

    <main id="view-overview">
      <section class="kpis" aria-label="Overview">
        <div class="kpi" id="kpi-sandboxes"></div>
        <div class="kpi" id="kpi-daemons"></div>
        <div class="kpi" id="kpi-active"></div>
        <div class="kpi kpi-traffic" id="kpi-traffic"></div>
      </section>

      <section class="controls">
        <input id="filter" type="search" placeholder="filter…" aria-label="Filter" />
        <label class="check">
          <input id="show-stopped" type="checkbox" checked />
          show stopped
        </label>
        <label class="check">
          <input id="show-other" type="checkbox" />
          show other msb sandboxes
        </label>
      </section>

      <section aria-label="Sandboxes">
        <h2 class="section-title">Sandboxes</h2>
        <div id="sandboxes" class="cards"></div>
      </section>

      <section aria-label="Connections">
        <h2 class="section-title">Connections</h2>
        <div id="conn-tabs" class="tabs" role="tablist"></div>
        <div id="connections"></div>
      </section>
    </main>

    <main id="view-detail" hidden>
      <nav class="crumbs">
        <a id="detail-back" href="#/">Sandboxes</a>
        /
        <span id="detail-name" class="mono"></span>
      </nav>
      <div id="detail-missing" class="empty" hidden></div>
      <div id="detail-body">
        <header class="detail-head">
          <h2 id="detail-title" class="mono"></h2>
          <span id="detail-pill"></span>
        </header>
        <dl id="detail-meta" class="meta"></dl>
        <section id="detail-hints"></section>
        <section aria-label="Daemons">
          <h3 class="section-title">Daemons</h3>
          <div id="detail-daemons"></div>
        </section>
        <section aria-label="Traffic">
          <h3 class="section-title">Traffic (last 10 min)</h3>
          <div id="detail-kpis" class="kpis"></div>
          <div id="detail-conn-tabs" class="tabs" role="tablist"></div>
          <div id="detail-connections"></div>
        </section>
        <section aria-label="Ports">
          <h3 class="section-title">Published ports</h3>
          <div id="detail-ports"></div>
        </section>
        <section aria-label="Commands">
          <h3 class="section-title">Commands</h3>
          <div id="detail-commands"></div>
        </section>
      </div>
    </main>

    <footer id="footer" class="footer"></footer>

    <dialog id="log-dialog" class="log-dialog">
      <div class="log-head">
        <strong id="log-title"></strong>
        <span class="spacer"></span>
        <label class="check">
          lines
          <select id="log-lines">
            <option value="100">100</option>
            <option value="200" selected>200</option>
            <option value="1000">1000</option>
          </select>
        </label>
        <button id="log-refresh" class="btn" type="button">Refresh</button>
        <button id="log-close" class="btn" type="button">Close</button>
      </div>
      <pre id="log-body" class="log-body mono"></pre>
    </dialog>
  </body>
</html>
