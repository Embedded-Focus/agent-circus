---
x-common-build-args: &common-build-args
  TZ: ${TZ:-Europe/Vienna}
  GIT_DELTA_VERSION: 0.19.2
  ZSH_IN_DOCKER_VERSION: 1.2.1

x-common-build: &common-build
  context: .
  dockerfile: Dockerfile
  args:
    <<: *common-build-args

x-common-service: &common-service
  build:
    <<: *common-build
  cap_add:
  - NET_ADMIN
  - NET_RAW
  environment:
    NODE_OPTIONS: --max-old-space-size=4096
    POWERLEVEL9K_DISABLE_GITSTATUS: "true"
  command: tail -f /dev/null
  user: node
  working_dir: /workspace

services:
  claude-code:
    <<: *common-service
    build:
      <<: *common-build
      target: claude-code
      args:
        <<: *common-build-args
        CLAUDE_CODE_VERSION: 2.1.142
        # https://github.com/agentclientprotocol/claude-agent-acp
        CLAUDE_AGENT_ACP_VERSION: 0.33.1
    volumes:
    - ${AGENT_CIRCUS_WORKSPACE:-..}:/workspace:cached
    - bashhistory:/commandhistory
    - ${HOME}/.cache:/home/node/.cache
    - ${HOME}/.claude:/home/node/.claude
    environment:
      AGENT_TYPE: claude-code
      NODE_OPTIONS: --max-old-space-size=4096
      CLAUDE_CONFIG_DIR: /home/node/.claude
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"

  codex:
    <<: *common-service
    build:
      <<: *common-build
      target: codex
      args:
        <<: *common-build-args
        # https://github.com/openai/codex
        CODEX_VERSION: 0.130.0
        # https://github.com/zed-industries/codex-acp
        CODEX_ACP_VERSION: 0.14.0
    volumes:
    - ${AGENT_CIRCUS_WORKSPACE:-..}:/workspace:cached
    - bashhistory:/commandhistory
    - ${HOME}/.cache:/home/node/.cache
    - ${HOME}/.codex:/home/node/.codex
    environment:
      AGENT_TYPE: codex

  mistral-vibe:
    <<: *common-service
    build:
      <<: *common-build
      target: mistral-vibe
      args:
        <<: *common-build-args
    volumes:
    - ${AGENT_CIRCUS_WORKSPACE:-..}:/workspace:cached
    - bashhistory:/commandhistory
    - ${HOME}/.cache:/home/node/.cache
    - ${HOME}/.vibe:/home/node/.vibe
    environment:
      AGENT_TYPE: mistral-vibe

  opencode:
    <<: *common-service
    build:
      <<: *common-build
      target: opencode
      args:
        <<: *common-build-args
        # https://www.npmjs.com/package/opencode-ai
        OPENCODE_VERSION: 1.15.0
    volumes:
    - ${AGENT_CIRCUS_WORKSPACE:-..}:/workspace:cached
    - bashhistory:/commandhistory
    - ${HOME}/.cache:/home/node/.cache
    - ${HOME}/.config/opencode:/home/node/.config/opencode
    environment:
      AGENT_TYPE: opencode

volumes:
  bashhistory:
