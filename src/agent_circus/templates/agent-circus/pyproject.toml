[project]
name = "agent-circus"
version = "0.1.0"
description = "AI Agent Circus DevContainer"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "gitpython >= 3.1.59",
    # https://github.com/mistralai/mistral-vibe
    "mistral-vibe>=2.24.5",
]

[tool.uv]
preview-features = ["audit-command"]
# mistral-vibe pins gitpython==3.1.58, which has known CVEs; override it.
override-dependencies = ["gitpython>=3.1.59"]
