name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          version: latest-known

      - name: Install Python
        run: uv python install "${UV_PYTHON}"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run checks
        run: make check

      - name: Smoke test installed wheel
        run: |
          uv build --wheel
          uv venv /tmp/agent-circus-wheel
          uv pip install --python /tmp/agent-circus-wheel/bin/python dist/*.whl
          cd /tmp
          PATH="/tmp/agent-circus-wheel/bin:$PATH" \
            /tmp/agent-circus-wheel/bin/python "$GITHUB_WORKSPACE/tests/smoke_test_package.py"
