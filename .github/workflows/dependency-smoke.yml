name: Dependency container smoke tests

on:
  workflow_dispatch:
    inputs:
      upstream:
        description: Resolve upstream dependencies before building
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [instant, deploy]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: latest-known
      - run: uv sync --locked
      - name: Deploy templates
        if: matrix.mode == 'deploy'
        run: uv run agent-circus init --deploy
      - name: Resolve upstream dependencies
        if: inputs.upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run agent-circus deps update
      - name: Build images and check agent executables
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from agent_circus.compose import _exec_compose, compose_build
          from agent_circus.context import build_compose_context

          with build_compose_context(Path.cwd()) as ctx:
              compose_build(ctx, [])
              for service, executable in (
                  ("claude-code", "claude"),
                  ("codex", "codex"),
                  ("opencode", "opencode"),
                  ("mistral-vibe", "vibe"),
              ):
                  _exec_compose([
                      "run", "--rm", "--no-deps", "--entrypoint", executable,
                      service, "--version",
                  ], ctx)
          PY
