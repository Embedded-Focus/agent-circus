name: Dependency container smoke tests

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - src/agent_circus/templates/Dockerfile.msb-agents
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msb-agents:
    name: Build msb-agents image and check agent executables
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build msb-agents image (agents target)
        uses: docker/build-push-action@v6
        with:
          context: src/agent_circus/templates
          file: src/agent_circus/templates/Dockerfile.msb-agents
          target: agents
          tags: msb-agents:smoke
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check agent executables
        run: |
          set -e
          for executable in opencode claude codex pi; do
            echo "::group::$executable --version"
            docker run --rm --entrypoint "$executable" msb-agents:smoke --version
            echo "::endgroup::"
          done
