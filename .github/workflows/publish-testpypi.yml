name: Publish to TestPyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
          version: latest-known

      - name: Install Python
        run: uv python install 3.14

      - name: Validate pre-release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            echo "Pre-release tag must look like v2.0.0rc1: $RELEASE_TAG" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/develop \
            && ! git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "Pre-release tag $RELEASE_TAG is not on develop or main" >&2
            exit 1
          fi
          uv run --no-project --python 3.14 python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          with pathlib.Path("pyproject.toml").open("rb") as file:
              project_version = tomllib.load(file)["project"]["version"]
          if tag_version != project_version:
              raise SystemExit(
                  f"Version mismatch: tag={tag_version!r}, pyproject.toml={project_version!r}"
              )
          PY

      - name: Build distributions
        run: uv build --no-sources

      - name: Validate distribution metadata
        run: uv run --with twine twine check --strict dist/*

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test_package.py

      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test_package.py

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/agent-circus/
    permissions:
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
          version: latest-known

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - name: Publish to TestPyPI
        run: uv publish --index testpypi
