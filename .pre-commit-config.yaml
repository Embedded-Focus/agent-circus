---
repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # ruff version; keep in sync with the ruff locked in uv.lock.
  rev: v0.17.3
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/astral-sh/ty-pre-commit
  # ty version; keep in sync with the ty locked in uv.lock.
  rev: v0.0.95
  hooks:
  - id: ty
- repo: local
  hooks:
  - id: pytest
    name: pytest
    entry: uv run pytest
    language: system
    pass_filenames: false
    always_run: true
  - id: uv-audit
    name: uv audit (root)
    entry: uv audit --locked
    language: system
    pass_filenames: false
    files: ^(pyproject\.toml|uv\.lock)$
  - id: uv-audit-agent-circus-template
    name: uv audit (agent-circus template)
    entry: uv --directory src/agent_circus/templates/agent-circus audit --locked
    language: system
    pass_filenames: false
    files: ^src/agent_circus/templates/agent-circus/(pyproject\.toml|uv\.lock)$
